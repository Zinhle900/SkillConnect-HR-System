<!DOCTYPE html>
<html>
<head>
    <title>Skill Connect - Student Form</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: grey;
        }

        /* HEADER */
        .header {
            background: linear-gradient(90deg, #ff4da6, #ff1f8f);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #ffe6f2;
        }

        /* FORM CONTAINER */
        .container {
            width: 420px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-top: 4px solid #ff4da6;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #111;
        }

        /* INPUTS */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff4da6;
            box-shadow: 0 0 8px rgba(255, 77, 166, 0.3);
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff4da6, #ff1f8f);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 77, 166, 0.4);
        }

        /* LABELS */
        label {
            font-size: 13px;
            color: #555;
        }

    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>Skill Connect</h1>
        <p>Student Profile Entry Form</p>
    </div>

    <!-- FORM -->
    <div class="container">
        <h2>Enter Your Details</h2>

        <form action="StudentServlet" method="POST">

            <label>Full Name</label>
            <input type="text" name="name" required>

            <label>Basic Skills</label>
            <input type="text" name="skills" placeholder="e.g. Communication, Teamwork">


            <label>Projects</label>
            <input type="text" name="projects" placeholder="e.g Library System">

            <label>Coding Languages</label>
            <input type="text" name="languages" placeholder="e.g. Java, Python, SQL">

            <label>Certifications</label>
            <input type="text" name="certifications" placeholder="e.g Oracle Java Cert">

            <button type="submit">Save Profile</button>

        </form>
    </div>

</body>
</html>
