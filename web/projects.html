<!DOCTYPE html>
<html>
<head>
    <title>View Projects</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f10;
            color: black;
            margin: 0;
        }

        .header {
            background: linear-gradient(90deg, #ff4da6, #ff1f8f);
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #333;
            color: #ccc;
        }

        th {
            color: #ff4da6;
        }

        tr:hover {
            background: #1a1a1a;
        }

        a {
            color: #ff4da6;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Projects</h2>
</div>

<div class="container">

    <table>
        <tr>
            <th>ID</th>
            <th>Project Name</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Student System</td>
            <td>Active</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Library App</td>
            <td>Completed</td>
        </tr>
    </table>

</div>

</body>
</html>
