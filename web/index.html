<!DOCTYPE html>
<html>
<head>
    <title>Skill Connect</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: grey /* HR grey background */
        }

        /* TOP HEADER */
        .header {
            background: linear-gradient(90deg, #ff4da6, #ff1f8f);
            color: black;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header h1 {
            margin: 0;
            font-size: 40px;
            letter-spacing: 1px;
        }

        .header p {
            margin-top: 8px;
            font-size: 14px;
            color: #ffe6f2;
        }

        /* MAIN CONTENT */
        .container {
            text-align: center;
            margin-top: 90px;
        }

        .box {
            display: inline-block;
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-top: 4px solid #ff4da6;
        }

        .box h2 {
            margin: 0;
            color: #111;
        }

        .box p {
            color: black;
            font-size: 14px;
            margin: 15px 0 25px;
        }

        /* BUTTON */
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(90deg, #ff4da6, #ff1f8f);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 77, 166, 0.4);
        }

        /* FOOTER */
        .footer {
            margin-top: 60px;
            text-align: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>Skill Connect</h1>
        <p>HR Candidate Profile Evaluation System</p>
    </div>

    <!-- MAIN WELCOME BOX -->
    <div class="container">
        <div class="box">
            <h2>Welcome to Skill Connect</h2>
<p>
A HR Talent Management System for managing student skills, projects, languages, and certifications.
</p>

            <a class="btn" href="role.html">Enter System</a>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 Skill Connect | HR Talent Management System
    </div>

</body>
</html>
