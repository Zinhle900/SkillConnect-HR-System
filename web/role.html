<!DOCTYPE html>
<html>
<head>
    <title>Skill Connect - Select Role</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: grey;
        }

        /* HEADER */
        .header {
            background: linear-gradient(90deg, #ff4da6, #ff1f8f);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header h1 {
            margin: 0;
            font-size: 38px;
        }

        .header p {
            margin-top: 8px;
            font-size: 14px;
            color: #ffe6f2;
        }

        /* CONTAINER */
        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 100px;
            flex-wrap: wrap;
        }

        /* ROLE CARDS */
        .card {
            width: 280px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            border-top: 4px solid #ff4da6;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(255, 77, 166, 0.25);
        }

        .card h2 {
            margin: 0;
            color: #111;
        }

        .card p {
            color: #666;
            font-size: 14px;
            margin: 15px 0 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(90deg, #ff4da6, #ff1f8f);
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 77, 166, 0.4);
        }

        /* FOOTER */
        .footer {
            margin-top: 80px;
            text-align: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>Skill Connect</h1>
        <p>Select your role to continue</p>
    </div>

    <!-- ROLE SELECTION -->
    <div class="container">

        <!-- STUDENT -->
        <div class="card">
            <h2>Student</h2>
            <p>
                Enter your skills, projects, languages, and certifications.
            </p>
            <a class="btn" href="student-form.html">Enter as Student</a>
        </div>

        <!-- HR -->
        <div class="card">
            <h2>HR</h2>
            <p>
                View and evaluate candidate profiles.
            </p>
            <a class="btn" href="HrServlet">Enter as HR</a>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 Skill Connect | HR Talent Management System
    </div>

</body>
</html>
